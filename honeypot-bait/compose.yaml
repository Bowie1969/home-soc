# Rootless Podman/Docker Compose for a Cowrie SSH honeypot bait box.
# By default this binds to localhost:2222 only — expose it to the internet
# deliberately (cloud host or router port-forward) when you are ready.
services:
  cowrie:
    image: docker.io/cowrie/cowrie:latest
    container_name: bait-cowrie
    restart: unless-stopped
    # Keep the honeypot on an isolated podman network; no access to host services.
    networks:
      - bait-net
    ports:
      - "127.0.0.1:2222:2222"
    environment:
      - COWRIE_TELNET_ENABLED=no
      - COWRIE_SSH_ENABLED=yes
      - COWRIE_SSH_LISTEN_ENDPOITNS=tcp:2222:interface=0.0.0.0
      - COWRIE_SSH_AUTH_PUBLICKEY_ALLOW_ANY=true
      - COWRIE_HOSTNAME=will-trading-pc
      - COWRIE_LOG_PATH=/cowrie/cowrie-git/var/log/cowrie
    volumes:
      - ./cowrie-logs:/cowrie/cowrie-git/var/log/cowrie
      - ./cowrie-data:/cowrie/cowrie-git/var/lib/cowrie


networks:
  bait-net:
    driver: bridge
    internal: false
